name: BGS AI pilot Cloudflare release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only check or deployment with the pilot closed
        type: choice
        options: [preflight, deploy]
        default: preflight
        required: true
      closed_free_confirmed:
        description: Workers Free and no custom routes or domains on this Worker (deployment only)
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: bgs-ai-pilot-cloudflare
  cancel-in-progress: false

jobs:
  cloudflare:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'teruluce/disney-bgs' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'teruluce' &&
      github.triggering_actor == 'teruluce'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/bgs-chronicles-ai
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run test:runtime
      - name: Verify or release the closed Worker
        env:
          WORKFLOW_OPERATION: ${{ inputs.operation }}
          CLOSED_FREE_CONFIRMED: ${{ inputs.closed_free_confirmed }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node cloudflare-release.mjs
